version: 1
project:
  id: 39588acc-c595-4afe-9fbf-72bab512152f
  # title:
  # description:
  keywords: []
  authors:
    - name: Barry Linkletter
      affiliations:
        - University of Prince Edward Island
  copyright: '2026'
  description: A webbook of Psi4 examples and exercises for chemistry students.
  license: CC-BY-NC-4.0
#  github: https://github.com/blinkletter/UsingPsi4
  bibliography:
    - references.bib
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  # To autogenerate a Table of Contents, run "myst init --write-toc"
  toc:
    - file: index.md
    - file: ch1/ch1-setup.md
      children:
        - file: ch1/ch1A-test.ipynb
    - file: ch2/ch2-small-molecules.ipynb
      children:
        - file: ch2/2A-water-structure/ch2A-water.ipynb
site:
  template: book-theme
  options:
