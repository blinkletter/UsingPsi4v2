version: 1
project:
  id: 39588acc-c595-4afe-9fbf-72bab512152f
  # title:
  # description:
  keywords: []
  authors:
    - name: Barry Linkletter
      affiliations:
        - University of Prince Edward Island
  copyright: '2026'
  description: A webbook of Psi4 examples and exercises for chemistry students.
  license: CC-BY-NC-4.0
#  github: https://github.com/blinkletter/UsingPsi4
  bibliography:
    - references.bib
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  # To autogenerate a Table of Contents, run "myst init --write-toc"
  toc:
    - file: index.md
    - file: ch1-setup.md
      children:
        - file: ch1A-test.ipynb
    - file: ch2-small-molecules.ipynb
      children:
        - file: ch2A-water.ipynb
    - file: Appendix1-helper-functions.md
    - title: Temp Notebooks
      children:
      - file: temp/01-structure.ipynb
      - file: temp/02-optimization.ipynb
      - file: temp/03-level-of-effort.ipynb
      - file: temp/04-vibrations.ipynb
      - file: temp/05-thermochemistry.ipynb
      - file: temp/06-isotope-effects.ipynb
      - file: temp/07-charges-dipole.ipynb
      - file: temp/08-surfaces.ipynb
      - file: temp/09-molecular-orbitals.ipynb
      - file: temp/10-bending-scan.ipynb
      - file: temp/11-bond-dissociation.ipynb
      - file: temp/12-acids-bases.ipynb
      - file: temp/13-hydrogen-bonding.ipynb
      - file: temp/14-solvation.ipynb
      - file: temp/15-helper-functions.md
    
